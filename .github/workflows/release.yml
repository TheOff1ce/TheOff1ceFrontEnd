name: Release

# Publishes the app in GitHub Releases.
# Trigger: push a version tag (git tag v1.0.0 && git push origin v1.0.0) or run it by hand
# from Actions → Release → Run workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  android:
    name: Build Android APK and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Test
        run: flutter test

      # Optional repository secrets:
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      #   MAPS_API_KEY (Google Maps client key restricted to this package + SHA-1)
      # Without the keystore the APK is signed with a throwaway debug key: it installs, but a
      # later APK signed with another key cannot update it (uninstall first).
      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release keystore."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: the APK is signed with a debug key."
          fi

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          defines=()
          if [ -n "$MAPS_API_KEY" ]; then defines+=("--dart-define=MAPS_API_KEY=$MAPS_API_KEY"); fi
          flutter build apk --release "${defines[@]}" -PMAPS_API_KEY="$MAPS_API_KEY"

      - name: Name the APK
        id: apk
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          cp build/app/outputs/flutter-apk/app-release.apk "FarmaGo-${tag}.apk"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "file=FarmaGo-${tag}.apk" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: FarmaGo ${{ steps.apk.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.file }}
          body: |
            ## 📱 Install FarmaGo

            **Android:** download `${{ steps.apk.outputs.file }}` below on your phone, open it and allow
            installing from this source when asked.

            **iPhone / any device:** open the web app in Safari or Chrome and choose
            *Add to Home Screen*.
