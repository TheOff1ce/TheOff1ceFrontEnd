<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FarmaGo: analiza tus fórmulas médicas y gestiona tus medicamentos.">
  <meta name="theme-color" content="#0474AC">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FarmaGo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FarmaGo</title>
  <link rel="manifest" href="manifest.json">
  <!-- Pantalla de carga (umbral de Doherty): se ve al instante mientras descarga el motor de
       Flutter y se quita con el primer cuadro de la app. Colores de farmago_tokens.dart. -->
  <style>
    html, body { margin: 0; height: 100%; background: #F3F8FA; }
    #carga {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 20px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #12303F; transition: opacity 220ms ease;
    }
    #carga img { width: 96px; height: 96px; }
    #carga .rueda {
      width: 32px; height: 32px; border-radius: 50%; border: 3px solid #C3D6DE;
      border-top-color: #0474AC; animation: girar 800ms linear infinite;
    }
    #carga p { margin: 0; font-size: 18px; }
    @keyframes girar { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #carga .rueda { animation: none; } }
  </style>
</head>
<body>
  <div id="carga" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <div class="rueda" aria-hidden="true"></div>
    <p>Cargando FarmaGo…</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var carga = document.getElementById('carga');
      if (!carga) return;
      carga.style.opacity = '0';
      setTimeout(function () { carga.remove(); }, 250);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
