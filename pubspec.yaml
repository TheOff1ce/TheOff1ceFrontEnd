name: farma_go
description: Farma Go mobile prescription analysis app.
publish_to: 'none'
version: 1.0.0+1
environment: {sdk: '>=3.3.0 <4.0.0'}
dependencies:
  flutter: {sdk: flutter}
  flutter_localizations: {sdk: flutter}
  flutter_web_plugins: {sdk: flutter}
  http: ^1.2.2
  http_parser: ^4.1.0
  image_picker: ^1.1.2
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.1
  go_router: ^18.0.2
  google_maps_flutter: ^2.12.0
  socket_io_client: ^3.1.2
  geolocator: ^14.0.0
  web: ^1.1.0
  camera: ^0.12.2
dev_dependencies:
  flutter_test: {sdk: flutter}
  flutter_lints: ^4.0.0
  fake_async: ^1.3.1
flutter:
  uses-material-design: true
  # Manrope (SIL OFL 1.1, see assets/fonts/OFL.txt) is bundled so text never
  # depends on a runtime download (FE-018).
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
