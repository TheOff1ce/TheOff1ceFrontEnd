name: farma_go
description: Farma Go mobile prescription analysis app.
publish_to: 'none'
version: 1.0.1+2
environment: {sdk: '>=3.5.0 <4.0.0'}
dependencies:
  flutter: {sdk: flutter}
  flutter_localizations: {sdk: flutter}
  flutter_web_plugins: {sdk: flutter}
  http: ^1.2.2
  http_parser: ^4.1.0
  image_picker: ^1.1.2
  flutter_secure_storage: ^10.0.0
  url_launcher: ^6.3.1
  # Google sign-in on Android/iOS: in-app browser tab that returns to farmago://auth/callback.
  flutter_web_auth_2: ^5.1.0
  go_router: ^18.0.2
  google_maps_flutter: ^2.12.0
  socket_io_client: ^3.1.2
  geolocator: ^14.0.0
  web: ^1.1.0
  camera: ^0.12.2
dev_dependencies:
  flutter_test: {sdk: flutter}
  flutter_lints: ^4.0.0
  fake_async: ^1.3.1
flutter:
  uses-material-design: true
  # Logo oficial FarmaGo con fondo transparente, 640 px. El original vive en docs/logo/logo.png.
  assets:
    - assets/images/logo_farmago.png
    - assets/images/logo_simbolo.png
    # Logo de Google para "Continuar con Google" (descargar de la guía oficial de marca).
    # Descomenta esta línea cuando el archivo exista; sin él el botón muestra una "G" neutra.
    - assets/images/google_g.png
  # Atkinson Hyperlegible Next es la única tipografía de la app (manual §4). Va en el paquete
  # para que el texto nunca dependa de una descarga en tiempo de ejecución (FE-018).
  fonts:
    # SIL OFL 1.1, see assets/fonts/atkinson/OFL.txt.
    - family: Atkinson Hyperlegible Next
      fonts:
        - asset: assets/fonts/atkinson/AtkinsonHyperlegibleNext-400.ttf
          weight: 400
        - asset: assets/fonts/atkinson/AtkinsonHyperlegibleNext-500.ttf
          weight: 500
        - asset: assets/fonts/atkinson/AtkinsonHyperlegibleNext-600.ttf
          weight: 600
        - asset: assets/fonts/atkinson/AtkinsonHyperlegibleNext-700.ttf
          weight: 700
